<!DOCTYPE html><html><head><title>Day 3</title></head><body>
<img src="https://picsum.photos/100?1" alt="img1">
<img src="https://picsum.photos/100?2" alt="img2">
<img src="https://picsum.photos/100?3" alt="img3">
<br><button id="remove">Remove All Images</button>
<button id="toggle">Toggle Images</button>
<script>
document.getElementById("remove").addEventListener("click", () => {
    document.querySelectorAll("img").forEach(img => img.remove());
});
document.getElementById("toggle").addEventListener("click", () => {
    document.querySelectorAll("img").forEach(img => {
        img.style.display = img.style.display === "none" ? "" : "none";
    });
});
</script></body></html>
